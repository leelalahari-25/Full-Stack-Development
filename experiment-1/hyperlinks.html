<!DOCTYPE html>
<html>
<head>
    <title>HTML Hyperlinks</title>
</head>
<body>

    <h1>HTML Hyperlinks</h1>

    <p>
        <a href="https://www.google.com" target="_blank">
            Open Google
        </a>
    </p>

    <p>
        <a href="https://www.youtube.com" target="_blank">
            Open YouTube
        </a>
    </p>

    <p>
        <a href="https://www.wikipedia.org" target="_self">
            Open Wikipedia
        </a>
    </p>
</body>
</html>
