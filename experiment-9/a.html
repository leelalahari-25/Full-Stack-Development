 <!DOCTYPE html>
<html>
<head>
    <title>JavaScript Functions</title>
</head>
<body>
    <h2>JavaScript Functions</h2>
    <script>
        function factorial(n) {
            let fact = 1;
            for (let i = 1; i <= n; i++) {
                fact = fact * i;
            }
            return fact;
        }
        function fibonacci(n) {
            let a = 0;
            let b = 1;
            let result = "";
            for (let i = 1; i <= n; i++) {
                result = result + a + " ";
                let c = a + b;
                a = b;
                b = c;
            }
            return result;
        }
        function prime(n) {
            if (n < 2) {
                return false;
            }
            for (let i = 2; i < n; i++) {
                if (n % i == 0) {
                    return false;
                }
            }
            return true;
        }
        function palindrome(n) {
            let original = n;
            let reverse = 0;
            while (n > 0) {
                let digit = n % 10;
                reverse = reverse * 10 + digit;
                n = Math.floor(n / 10);
            }
            return original == reverse;
        }
        let num = 5;
        document.write("<h3>Factorial of " + num + " = " + factorial(num) + "</h3>");
        document.write("<h3>Fibonacci Series = " + fibonacci(num) + "</h3>");
        let p = 7;
        if (prime(p)) {
            document.write("<h3>" + p + " is a Prime Number</h3>");
        } else {
            document.write("<h3>" + p + " is Not a Prime Number</h3>");
        }
        let pal = 121;
        if (palindrome(pal)) {
            document.write("<h3>" + pal + " is a Palindrome</h3>");
        } else {
            document.write("<h3>" + pal + " is Not a Palindrome</h3>");
        }
    </script>
</body>
</html>
