<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>
    <style>
        .box {
            width: 250px;
            background-color: yellow;
            padding: 20px;
            border: 5px solid red;
            margin: 30px;
            color: blue;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>CSS Box Model</h1>
    <div class="box">
        This is the Content area.
        <br>
        Padding gives space around content.
        <br>
        Border surrounds the box.
        <br>
        Margin gives space outside the box.
    </div>
</body>
</html>
