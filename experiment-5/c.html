<!DOCTYPE html>
<html>
<head>
    <title>CSS Font and Text</title>

    <style>

        .size {
            font-size: 25px;
            color: red;
        }

        .weight {
            font-weight: bold;
            color: blue;
        }

        .style {
            font-style: italic;
            color: green;
        }

        .decoration {
            text-decoration: underline;
            color: orange;
        }

        .transform {
            text-transform: uppercase;
            color: purple;
        }

        .alignment {
            text-align: center;
            color: brown;
        }

    </style>
</head>

<body>

    <h1>CSS Font and Text Properties</h1>
    <p class="size">This demonstrates font-size.</p>
    <p class="weight">This demonstrates font-weight.</p>
    <p class="style">This demonstrates font-style.</p>
    <p class="decoration">This demonstrates text-decoration.</p>
    <p class="transform">This demonstrates text transformation.</p>
    <p class="alignment">This demonstrates text alignment.</p>

</body>
</html>
