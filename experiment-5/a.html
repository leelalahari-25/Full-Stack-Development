<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors</title>
    <style>
        h1 {
            color: red;              
        }
        p {
            color: blue;            
            background-color: yellow;
        }

        div {
            color: green;
            background-color: orange;
        }
    </style>
</head>
<body>
    <h1>CSS Color Demonstration</h1>

    <p>This paragraph uses blue color.</p>

    <div>This division uses green text and orange background.</div>

</body>
</html>
