<!DOCTYPE html>
<html>
<head>
    <title>RegExp Object</title>
</head>
<body>
<h2>RegExp Object</h2>
<script>
    let pattern = /JavaScript/i;
    let text = "I am learning JavaScript";
    document.write("Test Result: " +
                   pattern.test(text) + "<br>");
    document.write("Match Result: " +text.match(pattern) + "<br><br>");
    document.write("Pattern: " +pattern.source + "<br>");
    document.write("Flags: " +pattern.flags);
</script>
</body>
</html>
